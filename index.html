<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schema a punto croce</title>
<style>
:root{--bg:#f7f8fa;--ink:#1f2933;--mute:#5f6b7a;--line:#d5dae1;--accent:#b4323a;--panel:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#171b21;--ink:#e8ebef;--mute:#9aa5b1;--line:#323a45;--accent:#e06a72;--panel:#1f242c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font:600 28px/1.2 Georgia,serif;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 20px;max-width:60ch}
.ctl{display:flex;flex-wrap:wrap;gap:16px;align-items:end;background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:6px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
input[type=range]{width:180px;accent-color:var(--accent)}
button,.file{font:inherit;background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:4px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#wrap{margin-top:20px;overflow:auto;border:1px solid var(--line);background:#fff;max-height:70vh}
canvas{display:block}
#info{margin:16px 0 8px;color:var(--mute)}
#leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;padding:0;list-style:none}
#leg li{display:flex;align-items:center;gap:8px;font-size:14px}
.sw{width:22px;height:22px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;border-radius:3px}
</style>
</head>
<body>
<main>
<h1>Da immagine a punto croce</h1>
<p class="sub">Carica un'immagine: lo schema viene creato nel tuo browser e l'immagine non viene inviata a nessun server.</p>
<div class="ctl">
  <label>Immagine<input id="file" type="file" accept="image/*"></label>
  <label>Larghezza: <span id="wv">60</span> punti<input id="w" type="range" min="20" max="150" value="60"></label>
  <label>Colori: <span id="kv">12</span><input id="k" type="range" min="2" max="30" value="12"></label>
  <label style="flex-direction:row;align-items:center;gap:8px"><input id="clean" type="checkbox" checked>Pulisci punti isolati</label>
  <button id="dl" disabled>Scarica PNG</button>
</div>
<div id="wrap"><canvas id="out" width="0" height="0"></canvas></div>
<div id="info">Nessuna immagine caricata.</div>
<ul id="leg"></ul>
</main>
<script>
const $=id=>document.getElementById(id);
const SYM="●■▲◆★+×○□△◇♥♣♠#@%&ABCDEFGHJKLMNPRSTUVWXYZ".split("");
let img=null;

$("file").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const i=new Image();
  i.onload=()=>{img=i; build()};
  i.src=URL.createObjectURL(f);
};
for(const id of ["w","k"]) $(id).oninput=()=>{$(id+"v").textContent=$(id).value; if(img) build()};
$("clean").onchange=()=>{if(img) build()};

function medianCut(px,k){
  let boxes=[px];
  while(boxes.length<k){
    let bi=-1,br=0,bc=0;
    boxes.forEach((b,i)=>{
      if(b.length<2) return;
      for(let c=0;c<3;c++){
        let lo=255,hi=0;
        for(const p of b){ if(p[c]<lo)lo=p[c]; if(p[c]>hi)hi=p[c]; }
        if(hi-lo>br){br=hi-lo;bi=i;bc=c}
      }
    });
    if(bi<0) break;
    const b=boxes[bi].sort((p,q)=>p[bc]-q[bc]), m=b.length>>1;
    boxes.splice(bi,1,b.slice(0,m),b.slice(m));
  }
  return boxes.map(b=>[0,1,2].map(c=>Math.round(b.reduce((s,p)=>s+p[c],0)/b.length)));
}
const hex=c=>"#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");

/* ELENCO PARZIALE di fili DMC: codice, nome indicativo, colore.
   I valori esadecimali vanno verificati e l'elenco va completato con un dataset DMC completo. */
const DMC=[
["B5200","Bianco neve","#FFFFFF"],["BLANC","Bianco","#FCFBF8"],["ECRU","Ecru","#F0EADA"],["310","Nero","#000000"],
["413","Grigio peltro scuro","#565656"],["414","Grigio acciaio scuro","#8C8C8C"],["318","Grigio acciaio chiaro","#ABABAB"],["415","Grigio perla","#D3D3D6"],["3799","Grigio peltro molto scuro","#424242"],
["321","Rosso","#C72B3B"],["666","Rosso vivo","#E31D42"],["817","Rosso corallo molto scuro","#BB051F"],["604","Mirtillo chiaro","#FFB0BE"],["3716","Rosa antico molto chiaro","#FFBDBD"],["758","Terracotta molto chiaro","#EEAA9B"],
["721","Arancio medio","#F27B35"],["947","Arancio bruciato","#FF7B4D"],
["743","Giallo medio","#FED376"],["726","Topazio chiaro","#FDD755"],["727","Topazio molto chiaro","#FFF1AF"],["444","Limone scuro","#FFD600"],
["702","Verde Kelly","#47A72F"],["700","Verde vivo","#07731B"],["704","Chartreuse vivo","#9ECF34"],["909","Verde smeraldo molto scuro","#156F49"],["320","Pistacchio medio","#69885A"],["368","Pistacchio chiaro","#A6C298"],
["797","Blu reale","#13477D"],["798","Blu delft scuro","#466A8E"],["826","Blu medio","#6B8EAD"],["813","Blu chiaro","#A1C2D7"],["820","Blu reale molto scuro","#0E365C"],
["550","Viola molto scuro","#5C184E"],
["436","Marrone chiaro (tan)","#CB904D"],["434","Marrone chiaro","#985E33"],["433","Marrone medio","#7A451F"],["801","Marrone caffè scuro","#653919"],["738","Tan molto chiaro","#ECCC9E"]
];
function lab(c){
  const f=v=>{v/=255;return v>.04045?((v+.055)/1.055)**2.4:v/12.92};
  const r=f(c[0]),g=f(c[1]),b=f(c[2]);
  const X=(.4124*r+.3576*g+.1805*b)/.95047, Y=.2126*r+.7152*g+.0722*b, Z=(.0193*r+.1192*g+.9505*b)/1.08883;
  const t=v=>v>.008856?Math.cbrt(v):7.787*v+16/116;
  return [116*t(Y)-16,500*(t(X)-t(Y)),200*(t(Y)-t(Z))];
}
const THREADS=DMC.map(([code,name,h])=>{
  const rgb=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  return {code,name,rgb,lab:lab(rgb)};
});
function near(l,arr){ // indice dell'elemento più vicino in spazio Lab
  let b=0,bd=1e9;
  arr.forEach((t,i)=>{
    const q=t.lab,d=(l[0]-q[0])**2+(l[1]-q[1])**2+(l[2]-q[2])**2;
    if(d<bd){bd=d;b=i}
  });
  return b;
}
function shrink(w,h){ // riduzione a gradini: evita l'aliasing dei bordi
  let cw=img.width,ch=img.height,src=img;
  while(cw/2>w && ch/2>h){
    cw=Math.round(cw/2); ch=Math.round(ch/2);
    const t=document.createElement("canvas"); t.width=cw; t.height=ch;
    const g=t.getContext("2d"); g.imageSmoothingQuality="high"; g.drawImage(src,0,0,cw,ch); src=t;
  }
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const x=c.getContext("2d"); x.imageSmoothingQuality="high";
  x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(src,0,0,w,h);
  return x.getImageData(0,0,w,h).data;
}
function cleanup(idx,w,h){ // un punto senza vicini dello stesso colore prende il colore dominante intorno
  const out=idx.slice();
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const me=idx[y*w+x], cnt={}; let same=0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const X=x+dx,Y=y+dy; if(X<0||Y<0||X>=w||Y>=h) continue;
      const n=idx[Y*w+X]; if(n===me) same++; cnt[n]=(cnt[n]||0)+1;
    }
    if(!same){
      let best=me,bc=0;
      for(const n in cnt) if(cnt[n]>bc){bc=cnt[n];best=+n}
      out[y*w+x]=best;
    }
  }
  return out;
}
function build(){
  const w=+$("w").value, k=+$("k").value;
  const h=Math.max(1,Math.round(w*img.height/img.width));
  const d=shrink(w,h), px=[];
  for(let i=0;i<d.length;i+=4) px.push([d[i],d[i+1],d[i+2]]);
  // 1) colori dominanti, 2) filo DMC più vicino a ciascuno (i doppioni si fondono)
  const used=[...new Set(medianCut(px.slice(),k).map(c=>near(lab(c),THREADS)))];
  const pal=used.map(i=>THREADS[i]);
  // 3) ogni punto prende il filo scelto più vicino
  let idx=px.map(p=>near(lab(p),pal));
  if($("clean").checked) idx=cleanup(idx,w,h);
  render(w,h,pal,idx);
}

function render(w,h,pal,idx){
  const names=pal; pal=pal.map(t=>t.rgb);
  const s=16, cv=$("out"), g=cv.getContext("2d");
  cv.width=w*s+2; cv.height=h*s+2;
  g.textAlign="center"; g.textBaseline="middle"; g.font="12px sans-serif";
  const n=pal.map(()=>0);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=idx[y*w+x], col=pal[i]; n[i]++;
    g.fillStyle=hex(col); g.fillRect(x*s+1,y*s+1,s,s);
    g.fillStyle=(0.299*col[0]+0.587*col[1]+0.114*col[2])>140?"#000":"#fff";
    g.fillText(SYM[i%SYM.length],x*s+1+s/2,y*s+1+s/2+1);
  }
  g.strokeStyle="rgba(0,0,0,.35)";
  for(let x=0;x<=w;x++){g.lineWidth=x%10?.5:1.8;g.beginPath();g.moveTo(x*s+1,1);g.lineTo(x*s+1,h*s+1);g.stroke()}
  for(let y=0;y<=h;y++){g.lineWidth=y%10?.5:1.8;g.beginPath();g.moveTo(1,y*s+1);g.lineTo(w*s+1,y*s+1);g.stroke()}
  $("info").textContent=`Schema di ${w} × ${h} punti, ${w*h} punti totali. Le linee più marcate segnano ogni 10 punti.`;
  $("leg").innerHTML=pal.map((c,i)=>!n[i]?"":`<li><span class="sw" style="background:${hex(c)};color:${(0.299*c[0]+0.587*c[1]+0.114*c[2])>140?"#000":"#fff"}">${SYM[i%SYM.length]}</span>DMC ${names[i].code} ${names[i].name} · ${n[i]} punti</li>`).join("");
  $("dl").disabled=false;
}

$("dl").onclick=()=>$("out").toBlob(b=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="schema-punto-croce.png"; a.click();
});
</script>
</body>
</html>
